services:
  - type: web
    name: mango-product-feed
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) — they're
      # secrets/deployment-specific and intentionally not committed:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_products,read_inventory
      - key: MOCK_SHOPIFY
        value: "false"
      - key: SHOPIFY_BILLING_TEST
        value: "false"
