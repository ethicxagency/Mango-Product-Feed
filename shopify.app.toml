# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "10cb2fc0804731facb9113ccd99f2f22"
name = "Mango Product Feed"
application_url = "https://app.mangofeed.nextupglobal.net"
embedded = true

[webhooks]
api_version = "2026-07"

  # Mandatory compliance webhooks — declared here (App Config API via
  # `shopify app deploy`), not in app/shopify.server.ts's runtime webhooks
  # config. compliance_topics is a distinct mechanism from regular
  # topic-based subscriptions; webhookSubscriptionCreate (the GraphQL
  # mutation registerWebhooks() calls per-shop) doesn't accept these
  # topics. uri paths match the existing route handlers exactly.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Kept in sync with the `scopes` read in app/shopify.server.ts (SCOPES env
# var, falling back to this same list) — least-privilege: only what
# ProductSyncService/CollectionSyncService/InventorySyncService query.
scopes = "read_products,read_inventory"
optional_scopes = [ ]
use_legacy_install_flow = false

# This app's authPathPrefix (app/shopify.server.ts) is "/auth", so
# "/auth/callback" is the only OAuth callback route it actually serves.
[auth]
redirect_urls = ["https://app.mangofeed.nextupglobal.net/auth/callback"]
