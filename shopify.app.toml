# Shopify CLI app configuration. `client_id` is populated automatically the
# first time you run `shopify app config link` (or `shopify app dev`) and
# select/create the corresponding app in your Partner Dashboard — it does not
# need to be filled in by hand.
name = "Mango Product Feed"
client_id = ""
application_url = "https://localhost:3000"
embedded = true

[access_scopes]
scopes = "read_products,read_inventory"

[auth]
redirect_urls = [
  "https://localhost:3000/auth/callback",
  "https://localhost:3000/auth/shopify/callback",
  "https://localhost:3000/api/auth/callback",
]

[webhooks]
api_version = "2025-01"

[pos]
embedded = false
