services:
  # Local Postgres instance matching the production database engine (see
  # prisma/schema.prisma). Run `docker compose up -d postgres`, then
  # `npm run db:migrate` against it — DATABASE_URL in .env already points
  # here by default.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: mango_product_feed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mango:mango@postgres:5432/mango_product_feed
      APP_URL: http://localhost:3000
    depends_on:
      - postgres

volumes:
  postgres_data:
